{{- if and (include "arkcase.subsystem.enabled" $) -}}
  {{- $db := (include "arkcase.db.info" $ | fromYaml) -}}
  {{- $jdbcUrl := ($db.jdbc.url | toString) -}}
  {{- if (eq ($db.workflowDbType | toString | lower) "mysql") -}}
    {{- /* Activiti requires useMysqlMetadata=true when talking to MySQL/MariaDB */ -}}
    {{- $flag := "useMysqlMetadata=true" -}}
    {{- if (regexMatch "(?i)[?&]useMysqlMetadata=" $jdbcUrl) -}}
      {{- /* The option is already present, make sure it's set to true */ -}}
      {{- $jdbcUrl = (regexReplaceAll "(?i)([?&])useMysqlMetadata=[^&]*" $jdbcUrl (printf "${1}%s" $flag)) -}}
    {{- else -}}
      {{- $sep := "&" -}}
      {{- if not (contains "?" $jdbcUrl) -}}
        {{- $sep = "?" -}}
      {{- else if (or (hasSuffix "?" $jdbcUrl) (hasSuffix "&" $jdbcUrl)) -}}
        {{- $sep = "" -}}
      {{- end -}}
      {{- $jdbcUrl = (printf "%s%s%s" $jdbcUrl $sep $flag) -}}
    {{- end -}}
  {{- end -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arkcase.core.conf.secret" $ | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "arkcase.labels" $ | nindent 4 }}
    {{- with ($.Values.labels).common }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with ($.Values.annotations).common }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  jdbcDriver: {{ $db.jdbc.driver | quote }}
  jdbcUrl: {{ $jdbcUrl | quote }}
  jdbcWorkflowDbType: {{ $db.workflowDbType | quote }}
  jdbcPlatform: {{ $db.platform | quote }}
  jdbcQuartzDelegate: {{ $db.quartzDelegate | quote }}
{{- end -}}
