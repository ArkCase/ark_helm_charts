{{- if and (include "arkcase.subsystem.enabled" $) (not (include "arkcase.samba.external" $)) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "arkcase.fullname" $ | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{- include "arkcase.labels.service" $ | nindent 4 }}
    {{- with ($.Values.labels).common }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with ($.Values.annotations).common }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "arkcase.labels.matchLabels" $ | nindent 6 }}
  serviceName: {{ include "arkcase.service.headless" $ | quote }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      name: {{ include "arkcase.fullname" $ | quote }}
      namespace: {{ $.Release.Namespace | quote }}
      labels: {{- include "arkcase.labels.service" $ | nindent 8 }}
        {{- include "arkcase.labels.deploys" "samba" | nindent 8 }}
        {{- with ($.Values.labels).common }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # NB: Both these annotation values must be of type "string"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        {{- with ($.Values.annotations).common }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "arkcase.image.pullSecrets" $ | nindent 6 }}
      {{- with $.Values.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.schedulerName }}
      schedulerName: {{ $.Values.schedulerName | quote }}
      {{- end }}
      serviceAccountName: {{ include "arkcase.serviceAccountName" $ | quote }}
      {{- /* Samba runs as non-root, so it needs this sysctl to listen on the low ports (389, 636, ...) */}}
      {{- $securityContext := (include "arkcase.securityContext" $ | fromYaml) }}
      {{- $portSysctl := "net.ipv4.ip_unprivileged_port_start" }}
      {{- $sysctls := list (dict "name" $portSysctl "value" "0") }}
      {{- range ($securityContext.sysctls | default list) }}
        {{- if ne .name $portSysctl }}
          {{- $sysctls = append $sysctls . }}
        {{- end }}
      {{- end }}
      securityContext: {{- set $securityContext "sysctls" $sysctls | toYaml | nindent 8 }}
      initContainers:
        - name: init-provision
          {{- include "arkcase.image" $ | nindent 10 }}
          env: {{- include "arkcase.tools.baseEnv" $ | nindent 12 }}
            {{- include "arkcase.acme.env" $ | nindent 12 }}
            - name: DOMAIN
              valueFrom:
                secretKeyRef:
                  name: &secretName {{ include "arkcase.fullname" $ | quote }}
                  key: DOMAIN_NAME
            - name: DOMAINPASS
              valueFrom:
                secretKeyRef:
                  name: *secretName
                  key: DOMAIN_PASSWORD
            - name: DOMAIN_REALM
              valueFrom:
                secretKeyRef:
                  name: *secretName
                  key: DOMAIN_REALM
            - name: JOIN
              value: "false"
            #- name: JOINSITE
            #  value: ""
            - name: INSECURELDAP
              value: "false"
            - name: MULTISITE
              value: "false"
            - name: NOCOMPLEXITY
              value: "true"
            - name: SERVICE_NAME
              value: &serviceName {{ include "arkcase.name" $ | quote }}
            - name: SEED_DIR
              value: &seedDir "/app/secrets"
          command: [ "/usr/local/bin/provision" ]
          resources: {{- include "arkcase.resources" $ | nindent 12 }}
          # This container needs SYS_ADMIN due to how Samba initializes its
          # provisioning. However, once that's done, this can be safely dropped.
          securityContext:
            # Provisioning needs root (the runtime doesn't): it also hands the
            # state and the logs over to the image's (non-root) runtime user
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            {{- include "arkcase.accounts.volumeMount" (dict "ctx" $ "type" "admin") | nindent 12 }}
            {{- include "arkcase.accounts.volumeMount" (dict "ctx" $ "type" "shared") | nindent 12 }}
            - name: &dataVol "data"
              mountPath: &dataDir "/var/lib/samba"
            - name: &configMap "configmap"
              mountPath: "/app/init/init.d/000-init-seeds-wrapper"
              subPath: &initSeedsWrapper "init-seeds-wrapper"
              readOnly: true
            - name: *configMap
              mountPath: "/usr/local/bin/init-seeds"
              subPath: &initSeeds "init-seeds"
              readOnly: true
            - name: &secrets "secrets"
              mountPath: *seedDir
              readOnly: true
            - name: &logsVol "logs"
              mountPath: &logsDir "/var/log/samba"
        {{- include "arkcase.initDependencies.container" $ | nindent 8 }}
      containers:
        - name: samba
          {{- include "arkcase.image" $ | nindent 10 }}
          env: {{- include "arkcase.tools.baseEnv" $ | nindent 12 }}
            {{- include "arkcase.acme.env" $ | nindent 12 }}
            - name: SPLIT_PROVISIONER
              value: "true"
            - name: DOMAIN
              valueFrom:
                secretKeyRef:
                  name: *secretName
                  key: DOMAIN_NAME
            - name: DOMAINPASS
              valueFrom:
                secretKeyRef:
                  name: *secretName
                  key: DOMAIN_PASSWORD
            - name: DOMAIN_REALM
              valueFrom:
                secretKeyRef:
                  name: *secretName
                  key: DOMAIN_REALM
            - name: JOIN
              value: "false"
            #- name: JOINSITE
            #  value: ""
            - name: INSECURELDAP
              value: "false"
            - name: MULTISITE
              value: "false"
            - name: NOCOMPLEXITY
              value: "true"
            - name: SERVICE_NAME
              value: *serviceName
          {{- include "arkcase.subsystem.ports" $ | nindent 10 }}
          resources: {{- include "arkcase.resources" $ | nindent 12 }}
          securityContext: {{- include "arkcase.securityContext" (dict "ctx" $ "container" "samba") | nindent 12 }}
          volumeMounts:
            {{- include "arkcase.acme.volumeMount" $ | nindent 12 }}
            {{- include "arkcase.accounts.volumeMount" (dict "ctx" $ "type" "admin") | nindent 12 }}
            {{- include "arkcase.accounts.volumeMount" (dict "ctx" $ "type" "shared") | nindent 12 }}
            - name: &initVol "init"
              mountPath: "/app/init"
            - name: *dataVol
              mountPath: *dataDir
            - name: *logsVol
              mountPath: *logsDir
            - name: *secrets
              mountPath: *seedDir
              readOnly: true
      volumes:
        {{- include "arkcase.acme.volume" $ | nindent 8 }}
        {{- include "arkcase.accounts.volume" (dict "ctx" $ "type" "admin") | nindent 8 }}
        {{- include "arkcase.accounts.volume" (dict "ctx" $ "type" "shared") | nindent 8 }}
        - name: *initVol
          emptyDir:
            sizeLimit: 1Gi
        {{- include "arkcase.persistence.volume" (dict "ctx" $ "name" "data") | nindent 8 }}
        {{- include "arkcase.persistence.volume" (dict "ctx" $ "name" "logs") | nindent 8 }}
        - name: *secrets
          secret:
            optional: false
            secretName: *secretName
            defaultMode: 0444
        - name: *configMap
          configMap:
            optional: false
            name: {{ include "arkcase.fullname" $ | quote }}
            defaultMode: 0444
            items:
              - key: *initSeedsWrapper
                path: *initSeedsWrapper
                mode: 0555
              - key: *initSeeds
                path: *initSeeds
                mode: 0555
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    {{- include "arkcase.persistence.volumeClaimTemplate" (dict "ctx" $ "name" "data") | nindent 4 }}
    {{- include "arkcase.persistence.volumeClaimTemplate" (dict "ctx" $ "name" "logs") | nindent 4 }}

  {{- include "arkcase.persistence.declareResources" (dict "ctx" $ "volume" "data") | nindent 0 }}
  {{- include "arkcase.persistence.declareResources" (dict "ctx" $ "volume" "logs") | nindent 0 }}

{{- end }}
