# Default values for hostpath-provisioner.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

strategyType: Recreate

## The operating mode:
##
##   rsync: one pod mounts all the PVCs in the namespace, and exposes them via an rsync daemon
##   clone: each PVC is copied into a new PVC named ${clonePrefix}-${pvcName} (optionally with
##          a different storageClassName), by its own Job
##   s3:    each PVC is uploaded into s3://${s3.bucket}/${s3.prefix}/${namespace}/${pvcName}.tar.gz,
##          or into s3://${s3.bucket}/${s3.prefix}/${namespace}/${pvcName}/ with s3-fs-mirror (see
##          s3.format), or downloaded from there (see s3.direction), by its own Job
##
## In the clone and s3 modes, each PVC (or pair of old and new PVCs) gets a Job of its own,
## named ${releaseName}-${pvcName}, whose pod mounts it by name. The Job completes once the
## copy succeeded, or fails.
mode: rsync

## The prefix for the new PVCs' names (clone mode only)
clonePrefix: clone

## The storageClassName for the new PVCs (clone mode only) - if not given, the
## cluster's default storage class will be used
# storageClassName:

## How many times each pod tries its copy before giving up (clone and s3 modes)
maxAttempts: 5

## How many times a Job replaces a pod that was lost (e.g. along with its node) before it
## fails (clone and s3 modes). A pod that gives up after maxAttempts fails its Job right away,
## and evicted or preempted pods are always replaced
backoffLimit: 3

## The S3 target (s3 mode only)
s3:
  # How the data is stored:
  #   tar:    as a .tar.gz archive per PVC, made with GNU tar (needs tar, gzip and the aws CLI
  #           in the image). An interrupted transfer starts over
  #   mirror: as one object per file, directory, etc., with s3-fs-mirror (needs s3-fs-mirror in
  #           the image). An interrupted transfer resumes where it left off
  format: tar

  # Which way the data flows:
  #   upload:   from each PVC into S3
  #   download: from S3 into each PVC (e.g. into the PVCs created by deploying the
  #             application, and released by scaling it down to 0)
  # Either way, the target ends up as an exact copy of the source (except lost+found)
  direction: upload

  # The bucket to upload into (required)
  bucket: ""

  # The bucket's region (optional, defaults to the AWS configuration's, which under
  # IRSA is the cluster's region) - required if the bucket is in another region
  region: ""

  # The prefix (optional) to prepend to ${namespace}/${pvcName}.tar.gz (or ${namespace}/${pvcName}/)
  prefix: ""

  # The ${namespace} part of the archives' (or trees') names (optional, defaults to the release's
  # namespace) - e.g. to download data that was uploaded from another namespace
  namespace: ""

  # The endpoint URL, for S3-compatible stores (optional)
  endpoint: ""

  # The ARN of the IAM role for the pods to assume via IRSA (optional): if given, a
  # ServiceAccount named serviceAccountName (default: the release's name) is created,
  # annotated with this role, and the pods run as that ServiceAccount
  irsaRole: ""

  # Static credentials (optional, not together with irsaRole) - if not given, the AWS
  # SDK's default credential chain is used (e.g. IRSA, or the node's instance profile)
  accessKey: ""
  secretKey: ""

  # (tar format only) Download each archive again after the transfer, and compare it against the
  # PVC's contents (with tar --diff: types, permissions, ownership, sizes, times and contents)
  verify: true

  # (mirror format only) What to do with a partly transferred file, when the copy is resumed:
  #   verify:  check what was transferred against the local copy, then continue
  #   blind:   continue without checking
  #   restart: transfer the file again from the start
  resume: verify

  # (mirror format only) How many files to transfer at the same time (optional, default: 8)
  concurrency: ""

  # (mirror format only) The bandwidth limit for each pod, in bytes per second, optionally with a K, M, G or
  # T suffix (optional, default: no limit)
  bwlimit: ""

  # (mirror format only) Extra arguments for s3-fs-mirror (optional, e.g. [ "--verbose" ], or
  # [ "--hardlinks", "copy" ] - see s3-fs-mirror --help)
  extraArgs: []

## The service account for the clone and s3 pods (optional): an existing one, or the
## name of the one to create when s3.irsaRole is given
# serviceAccountName:

image:
  registry: "public.ecr.aws"
  repository: "arkcase/nettest"
  # Note that by default we use appVersion to get image tag
  # tag:
  # pullPolicy: IfNotPresent

persistence:
  # If set to `false`, an ephemeral volume will be used instead and all other `persistence.*` parameters
  # are ignored.
  enabled: true

  # Set the default capacity for volumes in case none is assigned explicitly
  # and the default value is insufficient
  volumeSize:
    logs: "8Gi"

## Set the reclaimPolicy
reclaimPolicy: Delete

## Node selector
nodeSelector: {}

## Affinity
affinity: {}

## Tolerations
tolerations: []

rbac:
  create: true
  ## Ignored if rbac.create is true
  serviceAccountName: default

service:
  type: LoadBalancer
  ports:
    - name: rsync
      protocol: TCP
      port: &rsync 873

##
## Configure extra options for containers' liveness and readiness probes
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
## @param service.probes.enabled Enable liveness and readiness probes
## @param service.probes.spec.initialDelaySeconds Initial delay seconds for liveness and readiness probes
## @param service.probes.spec.periodSeconds Period seconds for liveness and readiness probes
## @param service.probes.spec.timeoutSeconds Timeout seconds for liveness and readiness probes
## @param service.probes.spec.failureThreshold Failure threshold for liveness and readiness probes
## @param service.probes.spec.successThreshold Success threshold for liveness and readiness probes
##
  probes:
    enabled: true
    spec:
      tcpSocket:
        port: *rsync
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 1
      successThreshold: 1
    startup:
      failureThreshold: 90
    liveness:
      failureThreshold: 3
