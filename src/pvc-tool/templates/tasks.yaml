{{- $mode := (include "pvc-tool.mode" $) -}}
{{- if ne $mode "rsync" -}}
{{- $release := .Release.Name -}}
{{- $namespace := .Release.Namespace -}}
{{- $clone := (eq $mode "clone") -}}
{{- $clonePrefix := (include "pvc-tool.clonePrefix" $) -}}
{{- $markerLabel := (include "pvc-tool.markerLabel" $) -}}
{{- $taskLabel := (include "pvc-tool.taskLabel" $) -}}
{{- $plan := (include "pvc-tool.plan" $ | fromYaml) -}}
{{- $scripts := (.Files.Glob "scripts/*") -}}
{{- $hostNetwork := (not (empty (include "arkcase.toBoolean" .Values.hostNetwork))) -}}
{{- $maxAttempts := (.Values.maxAttempts | default 5 | toString) -}}
{{- $backoffLimit := (.Values.backoffLimit | default 3 | toString) -}}
{{- if not (regexMatch "^(0|[1-9][0-9]*)$" $backoffLimit) -}}
  {{- fail (printf "The backoffLimit value [%s] must be a non-negative integer" $backoffLimit) -}}
{{- end -}}
{{- if not (regexMatch "^[1-9][0-9]*$" $maxAttempts) -}}
  {{- fail (printf "The maxAttempts value [%s] must be a positive integer" $maxAttempts) -}}
{{- end -}}

{{- $s3 := (.Values.s3 | default dict) -}}
{{- $s3Secret := "" -}}
{{- $s3Direction := ($s3.direction | default "upload" | toString | lower) -}}
{{- $s3Namespace := ($s3.namespace | default $namespace | toString) -}}
{{- $s3Format := ($s3.format | default "tar" | toString | lower) -}}
{{- $s3Resume := ($s3.resume | default "verify" | toString | lower) -}}
{{- $s3Concurrency := ($s3.concurrency | default "" | toString) -}}
{{- $s3BwLimit := ($s3.bwlimit | default "" | toString) -}}
{{- $s3ExtraArgs := ($s3.extraArgs | default list) -}}
{{- $irsaRole := "" -}}
{{- if eq $mode "s3" -}}
  {{- if not (has $s3Direction (list "upload" "download")) -}}
    {{- fail (printf "Unsupported S3 direction [%s] - must be either upload or download" $s3Direction) -}}
  {{- end -}}
  {{- if not (has $s3Format (list "tar" "mirror")) -}}
    {{- fail (printf "Unsupported S3 format [%s] - must be either tar or mirror" $s3Format) -}}
  {{- end -}}
  {{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $s3Namespace) -}}
    {{- fail (printf "The S3 namespace [%s] is not a valid namespace name" $s3Namespace) -}}
  {{- end -}}
  {{- if not $s3.bucket -}}
    {{- fail "Must provide the S3 bucket name (s3.bucket) to use the s3 mode" -}}
  {{- end -}}
  {{- if not (regexMatch "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" ($s3.bucket | toString)) -}}
    {{- fail (printf "The S3 bucket name [%s] is not valid" $s3.bucket) -}}
  {{- end -}}
  {{- if or $s3.accessKey $s3.secretKey -}}
    {{- if not (and $s3.accessKey $s3.secretKey) -}}
      {{- fail "The S3 accessKey and secretKey must be given together, or not at all" -}}
    {{- end -}}
    {{- $s3Secret = (printf "%s-s3" $release) -}}
  {{- end -}}
  {{- with $s3.irsaRole -}}
    {{- if $s3Secret -}}
      {{- fail "The S3 irsaRole may not be given along with an accessKey and secretKey: choose one" -}}
    {{- end -}}
    {{- if not (regexMatch "^arn:aws[a-z-]*:iam::[0-9]{12}:role/.+$" (toString .)) -}}
      {{- fail (printf "The S3 irsaRole [%s] is not a valid IAM role ARN" .) -}}
    {{- end -}}
    {{- $irsaRole = (toString .) -}}
  {{- end -}}
  {{- if not (has $s3Resume (list "verify" "blind" "restart")) -}}
    {{- fail (printf "Unsupported S3 resume mode [%s] - must be one of: verify, blind, restart" $s3Resume) -}}
  {{- end -}}
  {{- if and (not (empty $s3Concurrency)) (not (regexMatch "^[1-9][0-9]*$" $s3Concurrency)) -}}
    {{- fail (printf "The S3 concurrency value [%s] must be a positive integer" $s3Concurrency) -}}
  {{- end -}}
  {{- if and (not (empty $s3BwLimit)) (not (regexMatch "^[1-9][0-9]*[kKmMgGtT]?$" $s3BwLimit)) -}}
    {{- fail (printf "The S3 bwlimit value [%s] must be a byte count, optionally with a K, M, G or T suffix" $s3BwLimit) -}}
  {{- end -}}
  {{- if not (kindIs "slice" $s3ExtraArgs) -}}
    {{- fail "The S3 extraArgs value must be a list of strings" -}}
  {{- end -}}
{{- end -}}
{{- $serviceAccountName := ($.Values.serviceAccountName | default "" | toString) -}}
{{- if and $irsaRole (not $serviceAccountName) -}}
  {{- $serviceAccountName = $release -}}
{{- end -}}
{{- $s3Prefix := (list ($s3.prefix | default "" | toString | trimAll "/") $s3Namespace | compact | join "/") -}}

{{- /* The existing PVCs are the source, except when downloading from S3 into them */ -}}
{{- $download := (and (eq $mode "s3") (eq $s3Direction "download")) -}}
{{- $pvcRole := ($download | ternary "target" "source") -}}
{{- $pvcVar := (printf "%s_PVC" (upper $pvcRole)) -}}
{{- $hasTarget := (or $clone $download) -}}

{{- range $pvc := $plan.clones }}
---
{{ $pvc | toYaml }}
{{- end }}

{{- if $s3Secret }}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{ $markerLabel }}: {{ $release | quote }}
    {{- include "arkcase.labels.service" $ | nindent 4 }}
  name: {{ $s3Secret | quote }}
  namespace: {{ $namespace | quote }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $s3.accessKey | toString | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $s3.secretKey | toString | quote }}
{{- end }}

{{- if $irsaRole }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{ $markerLabel }}: {{ $release | quote }}
    {{- include "arkcase.labels.service" $ | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $irsaRole | quote }}
  name: {{ $serviceAccountName | quote }}
  namespace: {{ $namespace | quote }}
{{- end }}

{{- range $task := $plan.tasks }}
  {{- $labels := (include "arkcase.labels.service" $ | fromYaml) }}
  {{- $labels = set $labels $markerLabel $release }}
  {{- $labels = set $labels $taskLabel $task.name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  labels: {{- toYaml $labels | nindent 4 }}
  annotations:
    {{ printf "armedia.com/pvc-tool-%s" $pvcRole }}: {{ $task.claim | quote }}
    {{- if $clone }}
    armedia.com/pvc-tool-target: {{ $task.target | quote }}
    {{- end }}
  name: {{ $task.name | quote }}
  namespace: {{ $namespace | quote }}
spec:
  # Only ever one pod at a time: two of them would work on the same PVC
  parallelism: 1
  completions: 1
  # The pod already makes up to maxAttempts attempts, so a pod that fails is the end
  # of it - but a pod that's lost (e.g. with its node) is replaced, up to this many times
  backoffLimit: {{ $backoffLimit }}
  podFailurePolicy:
    # (the first rule that matches wins: a pod killed because it was disrupted - its node
    # drained, say - exits non-zero too, and must be replaced, not fail the Job)
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
      - action: FailJob
        onExitCodes:
          containerName: {{ $mode | quote }}
          operator: NotIn
          values: [ 0 ]
  template:
    metadata:
      labels: {{- toYaml $labels | nindent 8 }}
      annotations:
        # A transfer must not be cut short to scale the cluster down (neither applies to pods
        # that are done)
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      {{- include "arkcase.image.pullSecrets" $ | nindent 6 }}
      hostNetwork: {{ $hostNetwork }}
      {{- with $serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $mode | quote }}
          {{- include "arkcase.image" $ | nindent 10 }}
          command: [ "/usr/local/bin/migrate-pvc" ]
          {{- if and (eq $mode "s3") (eq $s3Format "mirror") $s3ExtraArgs }}
          # Passed on to s3-fs-mirror
          args: {{- toYaml (toStrings $s3ExtraArgs) | nindent 12 }}
          {{- end }}
          workingDir: &logsDir "/logs"
          resources: {{- include "arkcase.resources" (dict "ctx" $) | nindent 12 }}
          securityContext: {{- include "arkcase.securityContext" (dict "ctx" $ "container" "arkcase") | nindent 12 }}
          env:
            - name: "TASK_MODE"
              value: {{ $mode | quote }}
            - name: "MAX_ATTEMPTS"
              value: {{ $maxAttempts | quote }}
            - name: "LOGS_DIR"
              value: *logsDir
            - name: "POD_NAME"
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.name"
            - name: "POD_NAMESPACE"
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.namespace"
          {{- if not $download }}
            - name: "SOURCE_DIR"
              value: "/source"
          {{- end }}
          {{- if $hasTarget }}
            - name: "TARGET_DIR"
              value: "/target"
          {{- end }}
            - name: {{ $pvcVar | quote }}
              value: {{ $task.claim | quote }}
          {{- if $clone }}
            - name: "TARGET_PVC"
              value: {{ $task.target | quote }}
          {{- else }}
            - name: "S3_DIRECTION"
              value: {{ $s3Direction | quote }}
            - name: "S3_BUCKET"
              value: {{ $s3.bucket | toString | quote }}
            {{- with $s3.region }}
            - name: "S3_REGION"
              value: {{ . | toString | quote }}
            {{- end }}
            {{- with $s3.endpoint }}
            - name: "S3_ENDPOINT"
              value: {{ . | toString | quote }}
            {{- end }}
            - name: "S3_PREFIX"
              value: {{ (list $s3Prefix (printf "$(%s)" $pvcVar) | compact | join "/") | quote }}
            - name: "S3_FORMAT"
              value: {{ $s3Format | quote }}
            {{- if eq $s3Format "tar" }}
            - name: "S3_VERIFY"
              value: {{ (not (empty (include "arkcase.toBoolean" ((hasKey $s3 "verify") | ternary $s3.verify true)))) | toString | quote }}
            - name: "S3_TERSE"
              value: {{ (not (empty (include "arkcase.toBoolean" ((hasKey $s3 "terse") | ternary $s3.terse false)))) | toString | quote }}
            {{- else }}
            - name: "S3_RESUME"
              value: {{ $s3Resume | quote }}
            {{- with $s3Concurrency }}
            - name: "S3_CONCURRENCY"
              value: {{ . | quote }}
            {{- end }}
            {{- with $s3BwLimit }}
            - name: "S3_BWLIMIT"
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if $s3Secret }}
          envFrom:
            - secretRef:
                name: {{ $s3Secret | quote }}
          {{- end }}
          volumeMounts:
            - mountPath: *logsDir
              name: "pvc-tool-logs"
          {{- range $path, $_ := $scripts }}
            {{- $name := ($path | base) }}
            - mountPath: {{ printf "/usr/local/bin/%s" $name | quote }}
              name: "pvc-tool-scripts"
              subPath: {{ $name | quote }}
              readOnly: true
          {{- end }}
            - mountPath: {{ printf "/%s" $pvcRole | quote }}
              name: {{ $pvcRole | quote }}
              readOnly: {{ eq $pvcRole "source" }}
          {{- if $clone }}
            - mountPath: "/target"
              name: "target"
          {{- end }}
      volumes:
        - name: "pvc-tool-scripts"
          configMap:
            name: {{ $release | quote }}
            items:
              {{- range $path, $_ := $scripts }}
                {{- $name := ($path | base) }}
              - key: {{ $name | quote }}
                path: {{ $name | quote }}
                mode: 0555
              {{- end }}
            defaultMode: 0640
            optional: false
        # Logs also go to stdout - an emptyDir avoids attaching yet another volume
        - name: "pvc-tool-logs"
          emptyDir: {}
        - name: {{ $pvcRole | quote }}
          persistentVolumeClaim:
            claimName: {{ $task.claim | quote }}
      {{- if $clone }}
        - name: "target"
          persistentVolumeClaim:
            claimName: {{ $task.target | quote }}
      {{- end }}
{{- end }}
{{- end }}
